server:
  port: 8081
  tomcat:
    # keep-alive：同一 TCP 连接上最多跟多少条 HTTP、空闲多久关；不解决「建连阶段 dial 超时」。
    keep-alive-timeout: 60s
    max-keep-alive-requests: 15000
    # 高压下 dial: i/o timeout 多为 accept/线程跟不上，可酌情调大（按机器内存与延迟权衡）。
    threads:
      max: 800
      min-spare: 64
    max-connections: 20000
    accept-count: 8192
    # 压测关闭：SPRING_PROFILES_ACTIVE=loadtest（见 application-loadtest.yml）
    accesslog:
      enabled: true
      pattern: '%h %l %u %t "%r" %s %b port=%p time=%D'

spring:
  application:
    name: singularity-order
  datasource:
    url: jdbc:mysql://localhost:3306/singularity_order?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  consumer:
    order:
      topic: ${ROCKETMQ_CONSUMER_ORDER_TOPIC:order-topic}
      group: ${ROCKETMQ_CONSUMER_ORDER_GROUP:order-consumer-group}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
