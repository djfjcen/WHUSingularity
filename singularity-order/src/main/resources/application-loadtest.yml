server:
  tomcat:
    accesslog:
      enabled: false

logging:
  level:
    root: WARN
    com.lubover.singularity.order: WARN
    com.lubover.singularity.api: WARN
    org.apache.rocketmq: WARN
    org.springframework: WARN
